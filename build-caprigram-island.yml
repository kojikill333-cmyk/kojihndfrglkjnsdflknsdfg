name: Build CapriGram with Island

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'CapriGramIsland/**'
      - 'Entitlements/**'
      - '.github/workflows/build-caprigram-island.yml'
      - 'CapriGram.ipa'

jobs:
  build-island:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Select newest Xcode
        run: |
          echo "Installed Xcodes:"
          ls -d /Applications/Xcode*.app || true
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version
          swift --version

      - name: Build island framework and widget
        working-directory: CapriGramIsland
        run: |
          set -euo pipefail
          xcodebuild \
            -project CapriGramIsland.xcodeproj \
            -scheme CapriGramIslandKit \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

          xcodebuild \
            -project CapriGramIsland.xcodeproj \
            -scheme CapriGramIsland \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Locate built products
        id: products
        run: |
          set -euo pipefail
          PRODUCTS="CapriGramIsland/DerivedData/Build/Products/Release-iphoneos"
          FRAMEWORK="$PRODUCTS/CapriGramIslandKit.framework"
          APPEX="$PRODUCTS/CapriGramIsland.appex"
          test -d "$FRAMEWORK"
          test -d "$APPEX"
          echo "framework=$FRAMEWORK" >> "$GITHUB_OUTPUT"
          echo "appex=$APPEX" >> "$GITHUB_OUTPUT"
          echo "Framework:"
          ls -la "$FRAMEWORK"
          file "$FRAMEWORK/CapriGramIslandKit" || true
          echo "Extension:"
          ls -la "$APPEX"
          file "$APPEX/CapriGramIsland" || true

      - name: Unpack CapriGram.ipa
        run: |
          set -euo pipefail
          test -f CapriGram.ipa
          rm -rf build
          mkdir -p build
          unzip -q CapriGram.ipa -d build
          test -d build/Payload/Swiftgram.app

      - name: Embed island
        run: |
          set -euo pipefail
          APP="build/Payload/Swiftgram.app"
          mkdir -p "$APP/Frameworks" "$APP/PlugIns"
          rm -rf "$APP/Frameworks/CapriGramIslandKit.framework"
          rm -rf "$APP/PlugIns/CapriGramIsland.appex"
          cp -R "${{ steps.products.outputs.framework }}" "$APP/Frameworks/CapriGramIslandKit.framework"
          cp -R "${{ steps.products.outputs.appex }}" "$APP/PlugIns/CapriGramIsland.appex"

          # Drop codesign leftovers so a later resign starts clean.
          rm -rf "$APP/Frameworks/CapriGramIslandKit.framework/_CodeSignature"
          rm -rf "$APP/PlugIns/CapriGramIsland.appex/_CodeSignature"

      - name: Update app Info.plist
        run: |
          set -euo pipefail
          PLIST="build/Payload/Swiftgram.app/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :NSSupportsLiveActivities bool true" "$PLIST" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Set :NSSupportsLiveActivities true" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSSupportsLiveActivitiesFrequentUpdates bool true" "$PLIST" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Set :NSSupportsLiveActivitiesFrequentUpdates true" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :BGTaskSchedulerPermittedIdentifiers array" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :BGTaskSchedulerPermittedIdentifiers: string com.evoidk.caprigram.island" "$PLIST" 2>/dev/null || true
          echo "LiveActivities=$(/usr/libexec/PlistBuddy -c 'Print :NSSupportsLiveActivities' "$PLIST")"
          /usr/libexec/PlistBuddy -c "Print :BGTaskSchedulerPermittedIdentifiers" "$PLIST"

      - name: Fix island Info.plist placeholders
        run: |
          set -euo pipefail
          ISLAND_PLIST="build/Payload/Swiftgram.app/PlugIns/CapriGramIsland.appex/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier com.evoidk.caprigram.Island" "$ISLAND_PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleExecutable CapriGramIsland" "$ISLAND_PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleName CapriGramIsland" "$ISLAND_PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName CapriGram" "$ISLAND_PLIST"
          python3 - << 'PY'
          from pathlib import Path
          text = Path("build/Payload/Swiftgram.app/PlugIns/CapriGramIsland.appex/Info.plist").read_text(errors="replace")
          banned = ("$(PRODUCT_NAME)", "$(PRODUCT_BUNDLE_IDENTIFIER)", "$(EXECUTABLE_NAME)")
          found = [item for item in banned if item in text]
          if found:
              raise SystemExit(f"placeholders remain: {found}")
          print("island plist has no build placeholders")
          PY
          /usr/libexec/PlistBuddy -c "Print" "$ISLAND_PLIST"

      - name: Repackage unsigned IPA
        run: |
          set -euo pipefail
          rm -f CapriGram-Island-Unsigned.ipa
          # IPA is a zip whose first entry must be Payload/.
          ditto -c -k --keepParent build/Payload CapriGram-Island-Unsigned.ipa
          ls -lh CapriGram-Island-Unsigned.ipa
          unzip -l CapriGram-Island-Unsigned.ipa | head -n 30

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: CapriGram-Island-Unsigned
          path: CapriGram-Island-Unsigned.ipa
          retention-days: 14
          if-no-files-found: error

      - name: Upload entitlements
        uses: actions/upload-artifact@v4
        with:
          name: Entitlements
          path: Entitlements/*.entitlements
          retention-days: 14
          if-no-files-found: error
